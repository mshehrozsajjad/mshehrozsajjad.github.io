<!doctype html>
<!-- The share card (public/og.png): the hero as a 1200x630 poster. Not a page of the site; rendered by tools/og.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@500&display=block">
<style>
@font-face{font-family:'Shehroz Hand';src:url('../public/fonts/shehroz-hand.woff2') format('woff2')}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#F8F5EC;color:#111113;font-family:'Instrument Sans',sans-serif}
.word{position:absolute;font-weight:700;font-stretch:75%;font-size:330px;line-height:.8;letter-spacing:-.035em;text-transform:uppercase;color:#2D2BE0}
.hel{right:calc(50% + 96px);top:26px}
.lo{left:calc(50% + 150px);top:214px}
.me{position:absolute;left:50%;bottom:-120px;height:740px;translate:-50% 0;filter:drop-shadow(0 18px 30px rgba(20,16,10,.22))}
.note{position:absolute;left:calc(50% + 170px);top:70px;font:400 44px/1 'Shehroz Hand',cursive;rotate:8deg}
.claim{position:absolute;left:56px;bottom:52px;font-weight:700;font-stretch:75%;font-size:58px;line-height:.9;letter-spacing:-.02em;text-transform:uppercase}
.claim span{color:#2D2BE0}
.url{position:absolute;right:56px;bottom:56px;font:500 20px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#5C5C64}
</style>
</head>
<body>
<p class="word hel">Hel</p>
<p class="word lo">lo</p>
<img class="me" src="../public/assets/photos/shehroz-front.webp" alt="">
<p class="note">hi, i’m Shehroz</p>
<p class="claim">One person,<br><span>whole product.</span></p>
<p class="url">shehrozsajjad.com</p>
</body>
</html>
