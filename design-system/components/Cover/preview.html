<!doctype html>
<html lang="en">
<head>

<title>Shehroz Sajjad</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:320px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; }
  .stage { fill:var(--stage); }
  [data-theme="dark"] .stage { fill:var(--paper-raised); }
  [data-theme="dark"] .soft { fill:var(--lane); }
  .frame { rx:var(--radius-frame); }
  .clip { fill:var(--on-stage-muted); opacity:.55; rx:var(--radius-clip); }
  .clip.on { fill:var(--stage-signal); opacity:1; }
  .ph { fill:var(--stage-signal); }
  .sig { fill:var(--signal); rx:var(--radius-clip); }
  .soft { fill:var(--signal-soft); rx:var(--radius-clip); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:100px; line-height:.95; font-weight:600; letter-spacing:-.045em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">

<svg viewBox="0 0 480 320" width="480" height="320">
