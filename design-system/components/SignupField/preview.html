<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SignupField — preview</title></head>
<body>
<div class="sz-pad">
  <form class="sz-field" onsubmit="event.preventDefault()">
    <label for="sz-email" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Email address</label>
    <input id="sz-email" type="email" placeholder="you@domain.com">
    <button class="sz-btn sz-btn-primary" type="submit">Follow along</button>
  </form>
  <p class="sz-note">One email when I ship something. Double opt-in.</p>
</div>
</body>
</html>
